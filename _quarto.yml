date: last-modified
date-modified: last-modified
abstract: >+
   This paper shows how to compute the median of a sample by minimizing the sum of 
   absolute deviations function. The minimization is done using the left hand gradient
   of the sum of absolute deviations. The point where the left hand derivative changes
   sign is searched using dichotomy or gradient descent. Simulations conducted in
   the article reveal that these approaches are very promising. In particular, for each
   sample size considered, there is one among our methods that outperforms the matlab
   build-in function in terms of runtime.
keywords: [Mean, median, order statistics, sort, sum of absolute deviations]
